[project]
name = "musiccheck-recognition"
version = "0.1.0"
description = "Recognition engine interface, audio preprocessing and providers for MusicCheck"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/musiccheck_recognition"]
