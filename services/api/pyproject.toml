[project]
name = "musiccheck-api"
version = "0.1.0"
description = "MusicCheck HTTP API (FastAPI)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "musiccheck-recognition",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.18",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
]

[project.scripts]
musiccheck-api = "musiccheck_api.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/musiccheck_api"]

[tool.uv.sources]
musiccheck-recognition = { workspace = true }
